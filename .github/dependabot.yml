version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # nol8: the library's Go dependencies. Updates arrive as pull requests for the
  # owner to review; Dependabot security updates need the alerts setting on.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
