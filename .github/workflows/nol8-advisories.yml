name: nol8 upstream advisories

# nol8: govulncheck matches advisories by module path, so a scan of this fork
# never reports upstream quic-go's own advisories. nol8/advisories.sh checks the
# upstream release in nol8/UPSTREAM for them; govulncheck ./... covers the rest.
# GitHub disables scheduled workflows in a fork by default, so this one is
# enabled once on the Actions tab (see "Ownership and security" in README.md).

on:
  schedule:
    - cron: "41 5 * * *"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Upstream advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Check the upstream release in nol8/UPSTREAM
        run: nol8/advisories.sh
      - name: Scan this checkout
        if: ${{ !cancelled() }}
        run: govulncheck ./...
