name: nol8 upstream

# nol8: keeps this fork on upstream quic-go (see "Ownership and security" and
# "Updating to a new upstream release" in README.md). Every month and on demand:
# - "Upstream advisories" checks the upstream release in nol8/UPSTREAM for
#   upstream's own advisories, which govulncheck doesn't report for this
#   module path, and scans this checkout. It also runs on every pull request,
#   so a sync's pull request checks the release it moves to.
# - "Upstream sync" opens a pull request into master when upstream has a newer
#   release, with the token in the NOL8_SYNC_TOKEN secret.
# GitHub disables scheduled workflows in a fork by default, so this one is
# enabled once on the Actions tab.

on:
  schedule:
    - cron: "23 6 1 * *"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Upstream advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Check the upstream release in nol8/UPSTREAM
        run: nol8/advisories.sh
      - name: Scan this checkout
        if: ${{ !cancelled() }}
        run: govulncheck ./...

  sync:
    name: Upstream sync
    # nol8/sync.sh builds on master, and only master runs the schedule.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nol8-upstream-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Open a pull request for upstream's newest release
        env:
          GH_TOKEN: ${{ secrets.NOL8_SYNC_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: nol8/sync-pr.sh
