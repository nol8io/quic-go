name: nol8 upstream

# nol8: keeps this fork on upstream quic-go (see "Ownership and security" and
# "Updating to a new upstream release" in README.md). The advisory check runs every
# day, the sync every month, and both on demand:
# - "Upstream advisories" checks the upstream release in nol8/UPSTREAM for
#   upstream's own advisories, which govulncheck doesn't report for this
#   module path, and scans this checkout. It also runs on every pull request,
#   so a sync's pull request checks the release it moves to.
# - "Upstream sync" opens a pull request into master when upstream has a newer
#   release, with the token in the NOL8_SYNC_TOKEN secret.
# GitHub can disable scheduled workflows in a fork, and does after 60 days
# without activity; check that this one is active (gh workflow list).

on:
  schedule:
    # Daily: the advisory check. A monthly check can't meet the 7-day fix target.
    - cron: "23 6 * * *"
    # Monthly: also the sync.
    - cron: "41 6 1 * *"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Upstream advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Check the upstream release in nol8/UPSTREAM
        run: nol8/advisories.sh
      - name: Scan this checkout
        if: ${{ !cancelled() }}
        run: govulncheck ./...
      # A failed scheduled run opens one issue, so the owner and the repository's
      # watchers hear of an advisory at once, not only the person who last edited
      # the schedule.
      - name: Open an issue for a failed scheduled run
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream advisories check failed"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq length)
          if [ "$open" = 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "An advisory affects the upstream release in nol8/UPSTREAM, or this checkout. See $RUN_URL. Fix within 7 days: see README.md, Ownership and security."
          fi

  sync:
    name: Upstream sync
    # nol8/sync.sh builds on master, and only master runs the schedule. The daily
    # schedule is the advisory check; only the monthly one syncs.
    if: >-
      github.ref == 'refs/heads/master' && (
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '41 6 1 * *')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nol8-upstream-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Open a pull request for upstream's newest release
        env:
          GH_TOKEN: ${{ secrets.NOL8_SYNC_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: nol8/sync-pr.sh
